<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуинская Игра: Соедини Пары</title>
    <!-- Шрифт Eater: рубленый и жуткий -->
    <link href="https://fonts.googleapis.com/css2?family=Eater&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Eater', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #2a0a38;
        }

        /* --- ВРАЩАЮЩИЙСЯ И РАЗМЫТЫЙ ФОН (ВОРОНКА) --- */
        #bg-spiral {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-radial-gradient(
                circle at center,
                #f26d21 0px,
                #f26d21 60px,
                #572a7c 60px,
                #572a7c 120px
            );
            animation: spin 25s linear infinite;
            filter: blur(12px);
            z-index: -1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- ИГРОВОЙ КОНТЕЙНЕР --- */
        .game-container {
            background: rgba(25, 0, 40, 0.88);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(242, 109, 33, 0.4);
            text-align: center;
            max-width: 900px;
            width: 95%;
            backdrop-filter: blur(6px);
            border: 3px solid #f26d21;
            z-index: 1;
            transition: all 0.5s ease;
        }

        /* Основной заголовок игры */
        .main-title {
            color: #f26d21;
            font-size: 38px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
            letter-spacing: 1px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 10px #f26d21; }
            to { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 25px #f26d21, 0 0 35px #f26d21; }
        }

        /* --- СТРОГО 2 СТОЛБЦА --- */
        .board {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            transition: opacity 0.5s ease;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            width: 50%;
        }

        /* --- СЛОВА --- */
        .word-item {
            background-color: #f26d21;
            color: #fff;
            padding: 12px 8px;
            border-radius: 10px;
            font-family: 'Eater', sans-serif;
            font-size: 20px;
            cursor: grab;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            border: 2px solid transparent;
            user-select: none;
            text-shadow: 1px 1px 2px #000;
            word-break: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            touch-action: none;
            animation: float 4s ease-in-out infinite;
        }

        .word-item:nth-child(odd) { animation-delay: 0s; }
        .word-item:nth-child(even) { animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .word-item:active {
            cursor: grabbing;
        }

        .word-item:hover {
            transform: translateY(-3px) scale(1.03);
            background-color: #ff8c42;
            box-shadow: 0 6px 15px rgba(242, 109, 33, 0.6);
            animation-play-state: paused;
        }

        .word-item.dragging {
            opacity: 0.6;
            border: 2px dashed #fff;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            animation-play-state: paused;
        }

        .word-item.selected {
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 20px #f26d21, 0 0 10px #fff;
            background-color: #d95d14;
            animation-play-state: paused;
        }

        .word-item.matched {
            background-color: #4a4a4a;
            color: #888;
            pointer-events: none;
            box-shadow: none;
            transform: scale(0.95);
            border-color: #333;
            text-decoration: line-through;
            animation: pop 0.4s ease, fadeOut 0.4s ease 0.3s forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); background-color: #4caf50; }
            100% { transform: scale(0.95); }
        }

        @keyframes fadeOut {
            to { opacity: 0.5; }
        }

        .word-item.wrong {
            background-color: #8b0000;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-2deg); }
            40% { transform: translateX(8px) rotate(2deg); }
            60% { transform: translateX(-6px) rotate(-1deg); }
            80% { transform: translateX(6px) rotate(1deg); }
        }

        /* --- ФИНАЛЬНЫЙ ЭКРАН --- */
        .end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 30px 10px;
            animation: fadeInEnd 0.8s ease forwards;
        }

        @keyframes fadeInEnd {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .end-screen h1 {
            color: #f26d21;
            font-size: 32px;
            text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        .end-screen p {
            color: #fff;
            font-size: 22px;
            margin: 5px 0;
            text-shadow: 1px 1px 2px #000;
        }

        .end-screen p.sub-text {
            font-style: italic;
            color: #ccc;
            font-size: 20px;
        }

        .end-screen p.final-text {
            color: #f26d21;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000, 0 0 10px #f26d21;
        }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 600px) {
            .main-title { font-size: 24px; margin-bottom: 15px; }
            .game-container { padding: 15px; }
            .word-item { font-size: 14px; padding: 8px 4px; min-height: 50px; }
            .board { gap: 8px; }
            .column { gap: 8px; }
            .end-screen h1 { font-size: 22px; }
            .end-screen p { font-size: 16px; }
            .end-screen p.final-text { font-size: 18px; }
        }
    </style>
</head>
<body>

<div id="bg-spiral"></div>

<div class="game-container">
    <!-- Основной заголовок (скрывается в конце) -->
    <h1 class="main-title" id="main-title">Соедини Пары</h1>
    
    <!-- Игровое поле (скрывается в конце) -->
    <div class="board" id="board">
        <div class="column" id="col-left"></div>
        <div class="column" id="col-right"></div>
    </div>

    <!-- Финальный экран (без кнопки) -->
    <div class="end-screen" id="end-screen">
        <h1>ТЫ ВЫПОЛНИЛ(-А) СВОЕ ЗАДАНИЕ!</h1>
        <p class="sub-text">можешь спать спокойно... Пока...</p>
        <p class="final-text">Не забудь отправить скрин в группу!</p>
    </div>
</div>

<script>
    const pairs = [
        { id: 1, left: "заколдовать", right: "тюленя" },
        { id: 2, left: "сварить", right: "зелье" },
        { id: 3, left: "узреть", right: "книгу" },
        { id: 4, left: "обратить", right: "тыкву" },
        { id: 5, left: "прийти на", right: "кладбище" },
        { id: 6, left: "убрать", right: "могилу" },
        { id: 7, left: "вырезать", right: "фонарь Джека" },
        { id: 8, left: "испугаться", right: "призрака" },
        { id: 9, left: "съесть", right: "мозги" },
        { id: 10, left: "собрать", right: "конфеты" }
    ];

    let selectedLeft = null;
    let selectedRight = null;
    let matchesCount = 0;

    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    function initGame() {
        const leftCol = document.getElementById('col-left');
        const rightCol = document.getElementById('col-right');
        const mainTitle = document.getElementById('main-title');
        const board = document.getElementById('board');
        const endScreen = document.getElementById('end-screen');
        
        mainTitle.style.display = 'block';
        board.style.display = 'flex';
        endScreen.style.display = 'none';
        
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';
        
        selectedLeft = null;
        selectedRight = null;
        matchesCount = 0;

        let leftWords = pairs.map(p => ({ id: p.id, text: p.left }));
        let rightWords = pairs.map(p => ({ id: p.id, text: p.right }));

        leftWords = shuffle(leftWords);
        rightWords = shuffle(rightWords);

        function createWordElement(wordObj, columnType) {
            const div = document.createElement('div');
            div.classList.add('word-item');
            div.textContent = wordObj.text;
            div.dataset.id = wordObj.id;
            div.dataset.column = columnType;
            div.setAttribute('draggable', 'true');
            
            div.addEventListener('click', () => handleWordClick(div));
            
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragover', handleDragOver);
            div.addEventListener('drop', handleDrop);
            div.addEventListener('dragend', handleDragEnd);
            
            return div;
        }

        leftWords.forEach(word => leftCol.appendChild(createWordElement(word, 'left')));
        rightWords.forEach(word => rightCol.appendChild(createWordElement(word, 'right')));
    }

    // --- ЛОГИКА DRAG & DROP ---
    let draggedElement = null;

    function handleDragStart(e) {
        draggedElement = this;
        this.classList.add('dragging');
        e.dataTransfer.setData('text/plain', this.textContent);
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
        e.preventDefault();
        const target = e.target.closest('.word-item');
        
        if (draggedElement && target && draggedElement !== target && draggedElement.dataset.column === target.dataset.column) {
            const tempText = draggedElement.textContent;
            const tempId = draggedElement.dataset.id;
            
            draggedElement.textContent = target.textContent;
            draggedElement.dataset.id = target.dataset.id;
            
            target.textContent = tempText;
            target.dataset.id = tempId;
        }
    }

    function handleDragEnd() {
        this.classList.remove('dragging');
        draggedElement = null;
    }

    // --- ЛОГИКА ВЫБОРА И СОВПАДЕНИЯ ---
    function handleWordClick(element) {
        if (element.classList.contains('matched') || element.classList.contains('dragging')) return;

        const column = element.dataset.column;

        if (element.classList.contains('selected')) {
            element.classList.remove('selected');
            if (column === 'left') selectedLeft = null;
            if (column === 'right') selectedRight = null;
            return;
        }

        if (column === 'left') {
            if (selectedLeft) selectedLeft.classList.remove('selected');
            selectedLeft = element;
        } else {
            if (selectedRight) selectedRight.classList.remove('selected');
            selectedRight = element;
        }
        
        element.classList.add('selected');

        if (selectedLeft && selectedRight) {
            checkMatch();
        }
    }

    function checkMatch() {
        const idLeft = selectedLeft.dataset.id;
        const idRight = selectedRight.dataset.id;

        if (idLeft === idRight) {
            // Верное совпадение
            selectedLeft.classList.remove('selected');
            selectedRight.classList.remove('selected');
            
            selectedLeft.classList.add('matched');
            selectedRight.classList.add('matched');
            
            selectedLeft = null;
            selectedRight = null;
            matchesCount++;

            if (matchesCount === pairs.length) {
                // Победа! Показываем финальный экран
                setTimeout(() => {
                    document.getElementById('board').style.display = 'none';
                    document.getElementById('main-title').style.display = 'none';
                    document.getElementById('end-screen').style.display = 'flex';
                }, 700);
            } else {
                // Перемешиваем оставшиеся слова
                setTimeout(reshuffleRemaining, 700);
            }
        } else {
            // Неверное совпадение
            const leftEl = selectedLeft;
            const rightEl = selectedRight;
            
            leftEl.classList.add('wrong');
            rightEl.classList.add('wrong');
            
            leftEl.style.pointerEvents = 'none';
            rightEl.style.pointerEvents = 'none';

            setTimeout(() => {
                leftEl.classList.remove('wrong', 'selected');
                rightEl.classList.remove('wrong', 'selected');
                leftEl.style.pointerEvents = 'auto';
                rightEl.style.pointerEvents = 'auto';
                
                selectedLeft = null;
                selectedRight = null;
            }, 500);
        }
    }

    function reshuffleRemaining() {
        const leftCol = document.getElementById('col-left');
        const rightCol = document.getElementById('col-right');
        
        let leftItems = Array.from(leftCol.children).filter(el => !el.classList.contains('matched'));
        let rightItems = Array.from(rightCol.children).filter(el => !el.classList.contains('matched'));
        
        leftItems = shuffle(leftItems);
        rightItems = shuffle(rightItems);
        
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';
        
        leftItems.forEach(el => {
            el.classList.remove('matched', 'selected', 'dragging');
            leftCol.appendChild(el);
        });
        rightItems.forEach(el => {
            el.classList.remove('matched', 'selected', 'dragging');
            rightCol.appendChild(el);
        });
    }

    window.onload = initGame;
</script>

</body>
</html>
