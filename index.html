<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуин: Тыква в Лабиринте</title>
    <!-- Russo One — жирный, рубленый, читаемый шрифт с поддержкой кириллицы -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Russo One', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #2a0a38;
            touch-action: none;
        }

        /* --- ВРАЩАЮЩИЙСЯ И РАЗМЫТЫЙ ФОН (ВОРОНКА) --- */
        #bg-spiral {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-radial-gradient(
                circle at center,
                #f26d21 0px,
                #f26d21 60px,
                #572a7c 60px,
                #572a7c 120px
            );
            animation: spin 25s linear infinite;
            filter: blur(12px);
            z-index: -1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- ИГРОВОЙ КОНТЕЙНЕР --- */
        .game-container {
            background: rgba(25, 0, 40, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(242, 109, 33, 0.4);
            text-align: center;
            max-width: 700px;
            width: 95%;
            backdrop-filter: blur(6px);
            border: 3px solid #f26d21;
            z-index: 1;
        }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 20px 10px;
            animation: fadeInEnd 0.6s ease forwards;
        }

        .start-screen h1 {
            color: #f26d21;
            font-size: 42px;
            text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
            letter-spacing: 2px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 10px #f26d21; }
            to { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 25px #f26d21, 0 0 35px #f26d21; }
        }

        .start-screen .subtitle {
            color: #ccc;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .controls-box {
            background: rgba(87, 42, 124, 0.4);
            border: 2px dashed #f26d21;
            border-radius: 14px;
            padding: 18px 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
        }

        .controls-box .ctrl-title {
            color: #f26d21;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0 #000;
        }

        .controls-box .ctrl-line {
            color: #fff;
            font-size: 16px;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .controls-box .ctrl-line span {
            color: #f26d21;
        }

        /* --- ЛАБИРИНТ --- */
        #maze {
            display: none;
            margin: 0 auto;
            background: #1a0427;
            border: 3px solid #f26d21;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 0 25px rgba(242, 109, 33, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
            width: fit-content;
        }

        .cell {
            width: 22px;
            height: 22px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .cell.wall {
            background: #572a7c;
            border-radius: 3px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
        }

        .cell.floor {
            background: rgba(242, 109, 33, 0.08);
        }

        .cell.player::after {
            content: '🎃';
            font-size: 18px;
            animation: pumpkinBounce 0.6s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 6px #f26d21);
        }

        @keyframes pumpkinBounce {
            from { transform: scale(1) translateY(0); }
            to { transform: scale(1.15) translateY(-2px); }
        }

        .cell.exit::after {
            content: '🌀';
            font-size: 18px;
            animation: portalSpin 1.5s linear infinite;
            filter: drop-shadow(0 0 8px #f26d21);
        }

        @keyframes portalSpin {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        /* --- ФИНАЛЬНЫЙ ЭКРАН --- */
        .end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 30px 10px;
            animation: fadeInEnd 0.8s ease forwards;
        }

        @keyframes fadeInEnd {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .end-screen h1 {
            color: #f26d21;
            font-size: 34px;
            text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
            letter-spacing: 2px;
        }

        .end-screen p {
            color: #fff;
            font-size: 22px;
            text-shadow: 1px 1px 2px #000;
            letter-spacing: 1px;
        }

        .end-screen p.sub-text {
            color: #ccc;
            font-size: 20px;
        }

        .end-screen p.final-text {
            color: #f26d21;
            font-size: 24px;
            text-shadow: 1px 1px 0 #000, 0 0 10px #f26d21;
        }

        /* --- КНОПКА --- */
        .reset-btn {
            font-family: 'Russo One', sans-serif;
            font-size: 18px;
            background-color: #572a7c;
            color: #f26d21;
            border: 3px solid #f26d21;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .reset-btn:hover {
            background-color: #f26d21;
            color: #572a7c;
            border-color: #572a7c;
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 5px 20px rgba(242, 109, 33, 0.7);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 600px) {
            .start-screen h1 { font-size: 26px; }
            .start-screen .subtitle { font-size: 14px; }
            .controls-box { padding: 14px 16px; }
            .controls-box .ctrl-title { font-size: 16px; }
            .controls-box .ctrl-line { font-size: 13px; }
            .game-container { padding: 12px; }
            .cell { width: 14px; height: 14px; font-size: 11px; }
            .cell.player::after { font-size: 13px; }
            .cell.exit::after { font-size: 13px; }
            .end-screen h1 { font-size: 22px; }
            .end-screen p { font-size: 16px; }
            .end-screen p.final-text { font-size: 18px; }
            .reset-btn { font-size: 14px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

<div id="bg-spiral"></div>

<div class="game-container">

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="start-screen" id="start-screen">
        <h1>Тыква в лабиринте</h1>
        <p class="subtitle">Проведи тыкву через лабиринт к порталу</p>
        
        <div class="controls-box">
            <div class="ctrl-title">УПРАВЛЕНИЕ</div>
            <div class="ctrl-line"><span>Клавиатура:</span> стрелки ← ↑ ↓ → или WASD</div>
            <div class="ctrl-line"><span>Телефон:</span> свайпы по экрану</div>
            <div class="ctrl-line"><span>Цель:</span> довести 🎃 до 🌀</div>
        </div>

        <button class="reset-btn" onclick="startGame()">Войти в лабиринт</button>
    </div>

    <!-- ЛАБИРИНТ (появляется после старта) -->
    <div id="maze"></div>

    <!-- ФИНАЛЬНЫЙ ЭКРАН -->
    <div class="end-screen" id="end-screen">
        <h1>ТЫ ВЫПОЛНИЛ(-А) СВОЕ ЗАДАНИЕ!</h1>
        <p class="sub-text">можешь спать спокойно... Пока...</p>
        <p class="final-text">Не забудь отправить скрин в группу!</p>
    </div>

</div>

<script>
    // ===== НАСТРОЙКИ ЛАБИРИНТА =====
    const COLS = 21;
    const ROWS = 21;

    let maze = [];
    let player = { x: 1, y: 1 };
    let exitPos = { x: COLS - 2, y: ROWS - 2 };
    let gameActive = false;

    // ===== ГЕНЕРАЦИЯ ЛАБИРИНТА (Recursive Backtracker) =====
    function generateMaze() {
        maze = Array.from({ length: ROWS }, () => Array(COLS).fill(true));

        const stack = [];
        maze[1][1] = false;
        stack.push({ x: 1, y: 1 });

        const dirs = [
            { dx: 0, dy: -2 },
            { dx: 0, dy: 2 },
            { dx: -2, dy: 0 },
            { dx: 2, dy: 0 }
        ];

        while (stack.length > 0) {
            const current = stack[stack.length - 1];
            const neighbors = [];

            for (const d of dirs) {
                const nx = current.x + d.dx;
                const ny = current.y + d.dy;
                if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && maze[ny][nx]) {
                    neighbors.push({ x: nx, y: ny, dx: d.dx, dy: d.dy });
                }
            }

            if (neighbors.length > 0) {
                const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                maze[current.y + next.dy / 2][current.x + next.dx / 2] = false;
                maze[next.y][next.x] = false;
                stack.push({ x: next.x, y: next.y });
            } else {
                stack.pop();
            }
        }

        maze[exitPos.y][exitPos.x] = false;
    }

    // ===== ОТРИСОВКА =====
    function renderMaze() {
        const mazeEl = document.getElementById('maze');
        mazeEl.style.gridTemplateColumns = `repeat(${COLS}, auto)`;
        mazeEl.innerHTML = '';

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (maze[y][x]) {
                    cell.classList.add('wall');
                } else {
                    cell.classList.add('floor');
                }
                if (x === player.x && y === player.y) {
                    cell.classList.add('player');
                }
                if (x === exitPos.x && y === exitPos.y) {
                    cell.classList.add('exit');
                }
                mazeEl.appendChild(cell);
            }
        }
    }

    // ===== ДВИЖЕНИЕ =====
    function tryMove(dx, dy) {
        if (!gameActive) return;
        const nx = player.x + dx;
        const ny = player.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
        if (maze[ny][nx]) return;
        player.x = nx;
        player.y = ny;
        renderMaze();

        if (player.x === exitPos.x && player.y === exitPos.y) {
            winGame();
        }
    }

    function winGame() {
        gameActive = false;
        setTimeout(() => {
            document.getElementById('maze').style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex';
        }, 300);
    }

    // ===== УПРАВЛЕНИЕ =====
    document.addEventListener('keydown', (e) => {
        switch (e.key) {
            case 'ArrowUp': case 'w': case 'W': case 'ц': case 'Ц': tryMove(0, -1); break;
            case 'ArrowDown': case 's': case 'S': case 'ы': case 'Ы': tryMove(0, 1); break;
            case 'ArrowLeft': case 'a': case 'A': case 'ф': case 'Ф': tryMove(-1, 0); break;
            case 'ArrowRight': case 'd': case 'D': case 'в': case 'В': tryMove(1, 0); break;
        }
    });

    // Свайпы
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);
        if (Math.max(absDx, absDy) < 25) return;
        if (absDx > absDy) {
            tryMove(dx > 0 ? 1 : -1, 0);
        } else {
            tryMove(0, dy > 0 ? 1 : -1);
        }
    }, { passive: true });

    // ===== СТАРТ ИГРЫ =====
    function startGame() {
        player = { x: 1, y: 1 };
        exitPos = { x: COLS - 2, y: ROWS - 2 };
        generateMaze();
        renderMaze();
        gameActive = true;

        // Скрываем стартовый экран, показываем лабиринт
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('maze').style.display = 'grid';
    }

    // При загрузке показываем стартовый экран, лабиринт скрыт
    window.onload = () => {
        document.getElementById('maze').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
    };
</script>

</body>
</html>
